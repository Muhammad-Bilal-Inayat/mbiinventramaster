# Phase 0 bootstrap config: HTTP only, so Certbot can issue certificates.
# After certificates exist, replace this file with infra/nginx-https.conf
# (or uncomment the HTTPS block below and replace example.com with your domain).
# Do NOT enable the HTTPS block before /etc/letsencrypt holds real certs:
# Nginx will fail to start if the certificate files are missing.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
  listen 80;
  server_name _;
  client_max_body_size 20m;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

