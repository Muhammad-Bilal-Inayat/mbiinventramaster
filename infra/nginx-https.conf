# Full HTTPS config. Copy to infra/nginx.conf only AFTER Certbot has
# issued certificates for your domain, and replace example.com everywhere.
# Bootstrap flow: 1) start with infra/nginx.conf (HTTP), 2) run Certbot
# for your domain, 3) copy this file over infra/nginx.conf, 4) restart nginx.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
  listen 80;
  server_name example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  server_name example.com;
  ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 20m;
  location / {
    limit_req zone=api_limit burst=60 nodelay;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
